<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step Machine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
<link rel="shortcut icon" href="favicon/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="Step Machine" />
<link rel="manifest" href="favicon/site.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>

<style>
  :root {
    /* Warm walnut — softer, smoother */
    --wood-1: #a06a3a;
    --wood-2: #7a4922;
    --wood-3: #4d2c12;
    --wood-edge-light: rgba(255, 215, 165, 0.35);
    --wood-edge-dark: rgba(20, 8, 0, 0.7);

    /* Calm aluminum — desaturated, less shiny */
    --metal-1: #cac7c1;
    --metal-2: #a8a59f;
    --metal-3: #807d77;
    --metal-4: #555350;

    /* Surfaces */
    --panel-1: #f1e8d3;
    --panel-2: #d8caa9;
    --ink: #1a1612;
    --ink-2: #4a423a;

    /* Accent */
    --amber: #ffb347;
    --amber-deep: #c8841a;
    --amber-glow: rgba(255, 179, 71, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Space Grotesk", system-ui, sans-serif;
    color: var(--ink);
    /* Dark green wall — real photographed texture */
    background-color: #172b22;
    background-image: url("./assets/green-background.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display: grid;
    place-items: center;
    padding: 60px 24px 80px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow-x: hidden;
  }
  /* a soft vignette so the unit feels grounded on the wall */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 45%, transparent 0%, rgba(0,0,0,0.18) 60%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
    z-index: 0;
  }
  /* desk cast shadow under the unit */
  .machine-stage {
    position: relative;
    width: min(1180px, 100%);
    z-index: 1;
  }
  .machine-stage::before {
    content: "";
    position: absolute;
    left: 3%; right: 3%;
    bottom: -28px; height: 70px;
    background: radial-gradient(ellipse 75% 80% at center, rgba(0,0,0,0.55), transparent 70%);
    filter: blur(18px);
    pointer-events: none;
  }

  /* ============================================================
     SHELL — wood enclosure built from 4 photographed wood pieces
     (top/bottom horizontal, left/right vertical), scaled to fit.
     ============================================================ */
  /* tweakable frame thickness (kept in sync with image proportions) */
  :root {
    --frame-top: 56px;
    --frame-bottom: 52px;
    --frame-side: 32px;
  }
  .machine {
    position: relative;
    width: 100%;
    /* the inner padding leaves room for the wood frame images */
    padding: var(--frame-top) var(--frame-side) var(--frame-bottom);
    box-shadow:
      0 30px 50px -18px rgba(0,0,0,0.55),
      0 14px 22px -8px rgba(0,0,0,0.45);
  }
  /* the four wood frame pieces, each a scaled image */
  .frame-piece {
    position: absolute;
    pointer-events: none;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    z-index: 2;
  }
  .frame-piece.top {
    top: 0; left: 0; right: 0;
    height: var(--frame-top);
    background-image: url("./assets/top-bar.png");
  }
  .frame-piece.bottom {
    bottom: 0; left: 0; right: 0;
    height: var(--frame-bottom);
    background-image: url("./assets/bottom-bar.png");
  }
  .frame-piece.left {
    top: -5px; bottom: -5px; left: 0;
    width: var(--frame-side);
    background-image: url("./assets/left-bar.png");
    z-index: 3; /* sides extend past top/bottom and cap over them */
  }
  .frame-piece.right {
    top: -5px; bottom: -5px; right: 0;
    width: var(--frame-side);
    background-image: url("./assets/right-bar.png");
    z-index: 3;
  }

  /* ============================================================
     TOP METAL STRIP — calmer, slightly inset aluminum
     ============================================================ */
  .topbar {
    position: relative;
    height: 88px;
    border-radius: 3px;
    padding: 0 56px 0 56px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 24px;
    overflow: visible;
    z-index: 5;
    background:
      linear-gradient(180deg, var(--metal-1) 0%, #b8b5af 50%, var(--metal-2) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -1px 0 rgba(0,0,0,0.25),
      0 2px 3px rgba(0,0,0,0.45),
      0 6px 10px -2px rgba(0,0,0,0.4);
  }
  /* very subtle horizontal brushed grain */
  .topbar::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='100'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='3 0.04' numOctaves='1' seed='3'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");
    background-size: 100% 100%;
    mix-blend-mode: overlay;
    pointer-events: none;
    opacity: 0.7;
  }
  .topbar::after { display: none; }
  /* mounting screws on the metal strip corners */
  .topbar-screw {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    z-index: 4;
    background:
      radial-gradient(circle at 38% 32%, #f5f3ed 0%, #cdcac3 35%, #8d8a83 70%, #4a4844 100%);
    box-shadow:
      inset 0 -1px 1px rgba(0,0,0,0.5),
      inset 0 1px 1px rgba(255,255,255,0.7),
      0 1px 2px rgba(0,0,0,0.7),
      0 0 0 1px rgba(0,0,0,0.35);
  }
  .topbar-screw::before, .topbar-screw::after {
    content: "";
    position: absolute;
    background: linear-gradient(90deg, rgba(0,0,0,0.7), rgba(0,0,0,0.3));
    border-radius: 1px;
  }
  /* phillips slot */
  .topbar-screw::before {
    top: 50%; left: 18%; right: 18%; height: 1.5px;
    transform: translateY(-50%) rotate(35deg);
    box-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .topbar-screw::after {
    top: 18%; bottom: 18%; left: 50%; width: 1.5px;
    transform: translateX(-50%) rotate(35deg);
    box-shadow: 1px 0 0 rgba(255,255,255,0.3);
  }
  .topbar-screw.tl { top: 10px; left: 14px; }
  .topbar-screw.tr { top: 10px; right: 14px; }
  .topbar-screw.bl { bottom: 10px; left: 14px; }
  .topbar-screw.br { bottom: 10px; right: 14px; }

  .topbar-left, .topbar-right {
    display: flex; align-items: center; gap: 16px;
    position: relative; z-index: 2;
  }
  .topbar-right { justify-content: flex-end; }
  .topbar-center { display: flex; align-items: center; justify-content: center; gap: 18px; position: relative; z-index: 2; }

  /* Brand label — feels engraved */
  .brand {
    font-family: "Saira Condensed", sans-serif;
    font-weight: 700;
    letter-spacing: 0.18em;
    font-size: 14px;
    color: #2a2622;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-shadow:
      0 1px 0 rgba(255,255,255,0.6),
      0 -1px 0 rgba(0,0,0,0.15);
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, #fff 0%, #c8c5be 50%, #6a6864 100%);
    box-shadow:
      inset 0 -1px 0 rgba(0,0,0,0.4),
      0 1px 0 rgba(255,255,255,0.7),
      0 0 0 1px rgba(0,0,0,0.25);
  }

  /* ===== Hardware button (WAV/MIDI) ===== */
  .hw-btn {
    appearance: none; border: 0;
    font-family: "Saira Condensed", sans-serif;
    font-weight: 700; letter-spacing: 0.16em;
    font-size: 11px;
    text-transform: uppercase;
    color: #1f1c19;
    padding: 10px 14px 11px;
    border-radius: 5px;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background:
      linear-gradient(180deg, #f6f3ec 0%, #d8d3c8 50%, #aaa49a 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.95),
      inset 0 -1px 0 rgba(0,0,0,0.4),
      inset 1px 0 0 rgba(255,255,255,0.4),
      inset -1px 0 0 rgba(0,0,0,0.2),
      0 2px 0 rgba(40,30,20,0.45),
      0 4px 8px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 60ms, box-shadow 60ms;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7);
  }
  .hw-btn:hover { filter: brightness(1.03); }
  .hw-btn:active, .hw-btn[data-pressed="true"] {
    transform: translateY(2px);
    background: linear-gradient(180deg, #a8a39a 0%, #cdc8be 50%, #d8d3c8 100%);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,0.4),
      inset 0 -1px 0 rgba(255,255,255,0.6),
      0 0 0 rgba(0,0,0,0.4);
  }
  .hw-btn-icon {
    flex-shrink: 0;
    width: 12px;
    height: 12px;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.4));
  }
  .export-dropdown {
    position: relative;
  }
  .export-dropdown.is-open {
    z-index: 20;
  }
  .export-dropdown-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    border-radius: 5px;
    background-color: var(--wood-2);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.12),
      0 10px 22px rgba(0,0,0,0.55),
      0 4px 10px rgba(0,0,0,0.45);
  }
  .export-dropdown-item {
    width: 100%;
    justify-content: flex-start;
    white-space: nowrap;
    min-width: 132px;
  }

  /* ===== Transport (round chrome) ===== */
  .transport {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 0;
    cursor: pointer;
    position: relative;
    background:
      /* metal body */
      radial-gradient(circle at 35% 25%, #ffffff 0%, #e9e6df 25%, #b8b4ac 55%, #6f6c66 85%, #3a3835 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.85),
      inset 0 -3px 4px rgba(0,0,0,0.45),
      inset 0 0 0 1px rgba(0,0,0,0.45),
      0 3px 0 rgba(0,0,0,0.5),
      0 6px 14px rgba(0,0,0,0.55);
    display: grid; place-items: center;
    transition: transform 60ms;
  }
  .transport::before {
    /* recessed bezel */
    content: "";
    position: absolute; inset: 6px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 25%, #d6d3cc 0%, #8d8a83 70%, #5a5853 100%);
    box-shadow:
      inset 0 2px 3px rgba(0,0,0,0.5),
      inset 0 -1px 0 rgba(255,255,255,0.4);
  }
  .transport:active { transform: translateY(1px); box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.6),
      inset 0 -2px 3px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(0,0,0,0.4),
      0 1px 0 rgba(0,0,0,0.5),
      0 3px 8px rgba(0,0,0,0.5); }
  /* lit indicator dot when playing */
  .transport[data-playing="true"]::after {
    content: "";
    position: absolute; top: -4px; right: -4px;
    width: 12px; height: 12px; border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #fff5d8, var(--amber) 50%, #6a3d05 100%);
    box-shadow:
      0 0 12px var(--amber-glow),
      0 0 4px rgba(255,200,100,0.8),
      inset 0 -1px 1px rgba(0,0,0,0.4);
  }
  .transport-icon {
    width: 0; height: 0;
    border-left: 14px solid #1a1612;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    margin-left: 4px;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.4));
    position: relative;
    z-index: 1;
  }
  .transport[data-playing="true"] .transport-icon {
    width: 14px;
    height: 14px;
    border: 0;
    background: transparent;
    margin-left: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .transport[data-playing="true"] .transport-icon::before,
  .transport[data-playing="true"] .transport-icon::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 4px;
    height: 14px;
    background: #1a1612;
    border-radius: 1px;
    transform: translateY(-50%);
    filter: drop-shadow(0 1px 0 rgba(255,255,255,0.4));
  }
  .transport[data-playing="true"] .transport-icon::before { left: 1px; }
  .transport[data-playing="true"] .transport-icon::after { right: 1px; }

  /* ===== BPM display ===== */
  .bpm-screen {
    background:
      linear-gradient(180deg, #0d0a06 0%, #1a1410 50%, #0a0805 100%);
    color: var(--amber);
    font-family: "DM Mono", monospace;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: 0.08em;
    padding: 8px 16px 7px;
    border-radius: 4px;
    min-width: 96px;
    text-align: center;
    position: relative;
    box-shadow:
      inset 0 3px 5px rgba(0,0,0,0.85),
      inset 0 -1px 0 rgba(255,255,255,0.08),
      inset 0 0 0 1px rgba(0,0,0,0.6),
      0 1px 0 rgba(255,255,255,0.55),
      0 2px 2px rgba(0,0,0,0.4);
    text-shadow:
      0 0 10px rgba(255, 179, 71, 0.6),
      0 0 2px rgba(255, 200, 100, 0.9);
    cursor: ns-resize;
    touch-action: none;
  }
  /* glass reflection */
  .bpm-screen::before {
    content: "";
    position: absolute; inset: 1px 1px 50% 1px;
    border-radius: 3px 3px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
    pointer-events: none;
  }
  .bpm-screen .unit {
    font-size: 10px;
    color: #8a5a10;
    margin-left: 6px;
    letter-spacing: 0.18em;
  }
  .bpm-label {
    font-family: "Saira Condensed", sans-serif;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: #2a2622;
    text-transform: uppercase;
    margin-top: 5px;
    text-align: center;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  /* ===== Loop toggle (chrome rocker) ===== */
  .switch {
    display: inline-flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .switch-track {
    width: 42px; height: 24px;
    border-radius: 12px;
    background: linear-gradient(180deg, #2c2925 0%, #14110e 100%);
    position: relative;
    cursor: pointer;
    box-shadow:
      inset 0 3px 4px rgba(0,0,0,0.7),
      inset 0 -1px 0 rgba(255,255,255,0.12),
      inset 0 0 0 1px rgba(0,0,0,0.5),
      0 1px 0 rgba(255,255,255,0.5);
  }
  .switch-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px; border-radius: 50%;
    background:
      radial-gradient(circle at 35% 25%, #fafaf6 0%, #d6d3cc 40%, #8d8a83 80%, #4a4844 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.85),
      inset 0 -1px 1px rgba(0,0,0,0.5),
      0 1px 2px rgba(0,0,0,0.7),
      0 0 0 1px rgba(0,0,0,0.3);
    transition: left 140ms cubic-bezier(.6,.1,.3,1.4);
  }
  .switch[data-on="true"] .switch-thumb { left: 20px; }
  .switch[data-on="true"] .switch-track {
    background: linear-gradient(180deg, #3a2510 0%, #1a0f06 100%);
    box-shadow:
      inset 0 3px 4px rgba(0,0,0,0.7),
      inset 0 -1px 0 rgba(255,179,71,0.2),
      inset 0 0 12px rgba(255,179,71,0.18),
      inset 0 0 0 1px rgba(0,0,0,0.5),
      0 1px 0 rgba(255,255,255,0.5);
  }
  .switch-label {
    font-family: "Saira Condensed", sans-serif;
    font-size: 10px;
    letter-spacing: 0.22em;
    color: #2a2622;
    text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(255,255,255,0.5);
  }

  /* ============================================================
     WOOD BODY  (interior — no extra surface, just spacing)
     ============================================================ */
  .body {
    margin-top: 14px;
    padding: 0;
    position: relative;
    background: transparent;
    box-shadow: none;
  }

  /* ===== Cream control panel (also calm aluminum, like the topbar) ===== */
  .panel {
    position: relative;
    border-radius: 3px;
    padding: 22px 22px 22px 22px;
    background:
      linear-gradient(180deg, var(--metal-1) 0%, #b8b5af 50%, var(--metal-2) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -1px 0 rgba(0,0,0,0.25),
      0 2px 3px rgba(0,0,0,0.45),
      0 8px 14px -4px rgba(0,0,0,0.5);
  }
  .panel::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 3px;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='400'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='3 0.04' numOctaves='1' seed='6'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23b)'/></svg>");
    background-size: 100% 100%;
    pointer-events: none;
    mix-blend-mode: overlay;
    opacity: 0.6;
  }
  .panel::after { display: none; }
  .panel-title {
    font-family: "Saira Condensed", sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: #5a4a30;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: baseline;
    position: relative; z-index: 1;
  }
  .panel-title .right { letter-spacing: 0.34em; color: #8a7758; font-weight: 500; }

  /* corner mounting screws on the panel */
  .panel-screw {
    position: absolute;
    width: 8px; height: 8px; border-radius: 50%;
    z-index: 3;
    background:
      radial-gradient(circle at 35% 30%, #ddd9d0, #9a968d 60%, #5a564f 100%);
    box-shadow:
      inset 0 -1px 1px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.7),
      0 1px 1px rgba(0,0,0,0.6);
  }
  .panel-screw::after {
    content: "";
    position: absolute; top: 50%; left: 18%; right: 18%; height: 1px;
    background: rgba(0,0,0,0.7);
    transform: translateY(-50%) rotate(28deg);
    border-radius: 1px;
  }
  .panel-screw.tl { top: 6px; left: 6px; }
  .panel-screw.tr { top: 6px; right: 6px; }
  .panel-screw.bl { bottom: 6px; left: 6px; }
  .panel-screw.br { bottom: 6px; right: 6px; }

  /* ===== Rows ===== */
  .rows {
    position: relative; z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .grid-row {
    display: grid;
    grid-template-columns: 72px 1fr 92px;
    column-gap: 22px;
    align-items: center;
  }
  .grid-row .row-label { grid-column: 1; }
  .grid-row .steps { grid-column: 2; }
  .grid-row .knob-wrap { grid-column: 3; }
  .row-divider {
    grid-column: 1 / -1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(120, 90, 50, 0.35) 20%, rgba(120, 90, 50, 0.35) 80%, transparent);
  }

  .row-label {
    font-family: "Saira Condensed", sans-serif;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.14em;
    color: #1c1812;
    text-transform: uppercase;
    text-align: left;
    padding-left: 4px;
    cursor: pointer;
    text-shadow:
      0 1px 0 rgba(255,255,255,0.45),
      0 -1px 0 rgba(0,0,0,0.15);
  }
  .row-label .sub {
    display: block;
    font-weight: 500;
    font-size: 9px;
    letter-spacing: 0.28em;
    color: #4a4742;
    margin-top: -2px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  /* ===== 8-step grid in a row ===== */
  .steps {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 12px;
  }
  .step-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    display: grid; place-items: center;
  }
  .step-cell::before {
    content: "";
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    width: 6px; height: 2px; border-radius: 1px;
    background: transparent;
  }
  .step-cell[data-downbeat="true"]::before {
    background: #6b5a44;
    opacity: 0.7;
    box-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }

  /* ===== STEP PAD (recessed dark socket → chrome ON) ===== */
  .step {
    position: relative;
    width: 100%; max-width: 58px;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 60ms, box-shadow 80ms;
    /* OFF: deep recessed socket */
    background:
      radial-gradient(circle at 50% 50%,
        rgba(0,0,0,0.5) 0%,
        rgba(0,0,0,0.25) 50%,
        rgba(0,0,0,0.0) 75%),
      radial-gradient(circle at 65% 80%,
        rgba(255,255,255,0.3) 0%,
        rgba(255,255,255,0) 22%),
      linear-gradient(180deg, #6f6c66 0%, #8a8782 50%, #5a5854 100%);
    box-shadow:
      inset 0 3px 5px rgba(0,0,0,0.7),
      inset 0 -2px 2px rgba(255,255,255,0.45),
      inset 0 0 0 1px rgba(0,0,0,0.45),
      0 1px 0 rgba(255,255,255,0.55);
  }
  .step:hover {
    filter: brightness(1.04);
  }
  /* ON: chrome ball pad */
  .step[data-on="true"] {
    background:
      /* highlight kick */
      radial-gradient(circle at 32% 24%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 18%),
      /* secondary specular */
      radial-gradient(circle at 68% 18%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 12%),
      /* sphere body */
      radial-gradient(circle at 35% 30%, #fdfdfb 0%, #e6e3dc 22%, #b6b1a8 50%, #757169 80%, #3c3a36 100%);
    box-shadow:
      /* sphere ground shadow */
      0 3px 6px rgba(0,0,0,0.55),
      0 1px 2px rgba(0,0,0,0.5),
      /* rim edge */
      0 0 0 1px rgba(0,0,0,0.4),
      inset 0 -3px 5px rgba(0,0,0,0.45),
      inset 0 2px 2px rgba(255,255,255,0.85);
    transform: translateZ(0);
  }
  .step[data-on="true"]:hover { filter: brightness(1.04); }
  .step[data-on="true"]:active { transform: scale(0.97); }
  /* trigger flash */
  .step[data-trigger="true"]::after {
    content: "";
    position: absolute; inset: -2px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0) 65%);
    animation: triggerFlash 220ms ease-out forwards;
    pointer-events: none;
  }
  @keyframes triggerFlash {
    from { opacity: 1; transform: scale(1.06); }
    to { opacity: 0; transform: scale(1); }
  }

  /* ============================================================
     KNOB — sculpted aluminum + rubber cap
     ============================================================ */
  .knob-wrap {
    display: grid; grid-template-columns: 1fr; justify-items: center; gap: 6px;
  }
  .knob-label {
    font-family: "Saira Condensed", sans-serif;
    font-size: 9px;
    letter-spacing: 0.22em;
    color: #2c2924;
    text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(255,255,255,0.45);
    line-height: 1;
  }
  .knob {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: transparent;
    position: relative;
    cursor: pointer;
    border: 0;
    padding: 0;
    /* lifted shadow under knob */
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.45));
  }
  /* outer brushed metal collar */
  .knob::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background:
      /* directional sheen */
      conic-gradient(from 220deg,
        #f5f3ec 0deg, #b9b6b0 60deg, #6a6864 120deg,
        #4a4844 180deg, #6a6864 240deg, #b9b6b0 300deg, #f5f3ec 360deg);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }
  /* knurled rim teeth */
  .knob::after {
    content: "";
    position: absolute; inset: 2px;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(255,255,255,0.20) 0deg 1.5deg,
      rgba(0,0,0,0.30) 1.5deg 3deg);
    -webkit-mask: radial-gradient(circle, transparent 0 60%, #000 62% 100%);
    mask: radial-gradient(circle, transparent 0 60%, #000 62% 100%);
  }
  /* rubber cap — slightly raised, soft sheen */
  .knob-cap {
    position: absolute;
    top: 50%; left: 50%;
    width: 64%; height: 64%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background:
      /* highlight bloom */
      radial-gradient(circle at 35% 25%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 35%),
      /* secondary highlight */
      radial-gradient(circle at 30% 20%, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0) 12%),
      /* body */
      radial-gradient(circle at 38% 30%, #4a443d 0%, #2a2620 55%, #14110d 100%);
    box-shadow:
      inset 0 -2px 4px rgba(0,0,0,0.85),
      inset 0 2px 1px rgba(255,255,255,0.18),
      0 0 0 1px rgba(0,0,0,0.5),
      0 -1px 0 rgba(255,255,255,0.05);
  }
  .knob-indicator {
    position: absolute;
    top: 5px; left: 50%;
    width: 3px; height: 16px; border-radius: 1.5px;
    background: linear-gradient(180deg, #f5edd5, #c8a866 60%, #8a6628);
    transform-origin: 50% 27px;
    transform: translateX(-50%);
    box-shadow:
      0 0 1px rgba(0,0,0,0.6),
      0 0 6px rgba(255, 179, 71, 0.4),
      inset 0 0 0 0.5px rgba(0,0,0,0.3);
  }
  .knob-positions {
    font-family: "Saira Condensed", sans-serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: #2c2924;
    text-transform: uppercase;
    display: flex; gap: 10px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.45);
  }
  .knob-positions span { opacity: 0.4; transition: opacity 120ms; }
  .knob-positions span[data-active="true"] { opacity: 1; color: #0a0807; font-weight: 700; }

  /* ============================================================
     FOOTPLATE
     ============================================================ */
  .footplate {
    margin-top: 16px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px;
    font-family: "Saira Condensed", sans-serif;
    font-size: 10px;
    letter-spacing: 0.28em;
    color: rgba(255, 220, 180, 0.55);
    text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(0,0,0,0.5);
  }
  .footplate .serial { font-family: "DM Mono", monospace; letter-spacing: 0.12em; font-size: 10px; }

  .corner-screw {
    width: 11px; height: 11px; border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, #e2dfd8 0%, #a8a59e 45%, #6a6863 75%, #2c2a27 100%);
    box-shadow:
      inset 0 -1px 1px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.8),
      0 1px 1px rgba(0,0,0,0.7),
      0 0 0 1px rgba(0,0,0,0.4);
    position: relative;
  }
  .corner-screw::before, .corner-screw::after {
    content: "";
    position: absolute;
    background: rgba(0,0,0,0.7);
  }
  .corner-screw::before {
    top: 50%; left: 18%; right: 18%; height: 1.2px;
    transform: translateY(-50%) rotate(28deg);
    box-shadow: 0 1px 0 rgba(255,255,255,0.4);
  }
  .corner-screw::after {
    top: 18%; bottom: 18%; left: 50%; width: 1.2px;
    transform: translateX(-50%) rotate(28deg);
  }
  .screws-row { display: flex; gap: 8px; }

  /* hint */
  .hint {
    margin-bottom: 18px;
    font-family: "DM Mono", monospace;
    font-size: 11px;
    color: rgba(255, 220, 180, 0.45);
    letter-spacing: 0.04em;
    text-align: center;
    z-index: 1;
    position: relative;
  }
  .hint kbd {
    font-family: inherit;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 3px;
    padding: 1px 6px;
    color: #ddc8a8;
    box-shadow: 0 1px 0 rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  @media (max-width: 760px) {
    .topbar {
      height: auto;
      padding: 14px;
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      gap: 12px;
      align-items: start;
    }
    .topbar-left {
      grid-column: 1;
      grid-row: 1;
      justify-content: flex-start;
      align-self: start;
    }
    .topbar-center {
      grid-column: 2;
      grid-row: 1;
      justify-content: flex-end;
      align-items: flex-start;
      align-self: start;
    }
    .topbar-center .bpm > div {
      align-items: flex-end;
    }
    .topbar-right {
      grid-column: 1 / -1;
      grid-row: 2;
      justify-content: center;
      width: 100%;
    }
  }

  @media (max-width: 600px) {
    body { padding: 24px 12px 48px; }
    :root {
      --frame-top: 44px;
      --frame-bottom: 40px;
      --frame-side: 16px;
    }
    .panel { padding: 14px; }
    .rows { gap: 16px; }
    .grid-row {
      grid-template-columns: 1fr auto;
      grid-template-rows: auto auto;
      column-gap: 8px;
      row-gap: 8px;
      align-items: center;
    }
    .grid-row .steps {
      grid-column: 1 / -1;
      grid-row: 1;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      touch-action: none;
      width: 100%;
    }
    .grid-row .row-label {
      grid-column: 1;
      grid-row: 2;
      font-size: 18px;
      padding-left: 0;
      justify-self: start;
    }
    .grid-row .knob-wrap {
      grid-column: 2;
      grid-row: 2;
      justify-self: end;
    }
    .step-cell {
      aspect-ratio: auto;
      min-width: 0;
      min-height: 0;
      width: 100%;
    }
    .step {
      width: 100%;
      max-width: none;
      aspect-ratio: 1 / 1;
    }
    .knob { width: 48px; height: 48px; }
    .knob-positions { gap: 6px; }
  }
</style>
</head>

<body>
  <div id="root"></div>

  <script>
    (async () => {
      if (location.protocol === 'file:') {
        document.getElementById('root').innerHTML =
          '<div style="max-width:520px;padding:2rem;color:#fff;font-family:system-ui,sans-serif;line-height:1.5">' +
          '<h2 style="margin:0 0 1rem;font-family:inherit">Local preview needs a web server</h2>' +
          '<p>Browsers block loading the app scripts from a <code>file://</code> URL. From the <code>step-machine</code> folder, run:</p>' +
          '<pre style="background:rgba(0,0,0,0.35);padding:1rem;border-radius:6px;overflow:auto">python3 -m http.server 8000</pre>' +
          '<p>Then open <a href="http://localhost:8000/" style="color:#ffb347">http://localhost:8000/</a></p>' +
          '</div>';
        return;
      }

      const BUILD = '20260623-hint';
      const files = [
        './tweaks-panel.jsx',
        './audio-engine.js',
        './export-utils.js',
        './components.jsx',
        './app.jsx',
      ];

      for (const file of files) {
        const url = `${file}?v=${BUILD}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Failed to load ${file}: ${res.status}`);
        const code = await res.text();
        const out = Babel.transform(code, { presets: ['react', 'env'], filename: file }).code;
        const script = document.createElement('script');
        script.text = out;
        document.body.appendChild(script);
      }
      console.log('Step Machine', BUILD, 'loaded');
    })().catch((err) => {
      console.error(err);
      document.getElementById('root').innerHTML =
        '<p style="padding:2rem;color:#fff;font-family:system-ui,sans-serif">Failed to load Step Machine. Check the browser console for details.</p>';
    });
  </script>
</body>
